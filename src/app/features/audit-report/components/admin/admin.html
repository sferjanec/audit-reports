<div class="admin-container">
  <h2>Admin Tasks</h2>

  @if (tasksResource.isLoading()) {
    <div class="loading-spinner">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  } @else if (tasksResource.error()) {
    <p class="error-message">Error loading tasks: {{ tasksResource.error() }}</p>
  } @else {
    <table mat-table [dataSource]="tasksResource.value() || []" class="mat-elevation-z8">
      <!-- ID Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let task"> {{task.id}} </td>
      </ng-container>

      <!-- Task Name Column -->
      <ng-container matColumnDef="taskName">
        <th mat-header-cell *matHeaderCellDef> Task Name </th>
        <td mat-cell *matCellDef="let task"> {{task.taskName}} </td>
      </ng-container>

      <!-- Status Column -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef> Status </th>
        <td mat-cell *matCellDef="let task">
          <span class="status-badge" [ngClass]="task.status.toLowerCase().replace(' ', '-')">
            {{task.status}}
          </span>
        </td>
      </ng-container>

      <!-- Priority Column -->
      <ng-container matColumnDef="priority">
        <th mat-header-cell *matHeaderCellDef> Priority </th>
        <td mat-cell *matCellDef="let task">
          <span class="priority-label" [ngClass]="task.priority.toLowerCase()">
            {{task.priority}}
          </span>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  }
</div>
